name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual outcome
      description: What happened instead? Remove secrets and sensitive data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit SHA, release, or branch
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add safe logs or screenshots and describe the environment.
