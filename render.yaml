services:
  - type: web
    name: smartassistance-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace @smartassistance/api
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_TIMEOUT_MS
        value: "15000"
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "1024"
      - key: RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: MAX_CONCURRENT_REWRITES
        value: "1"
      - key: MAX_BODY_BYTES
        value: "65536"
      - key: SMARTASSISTANCE_API_TOKEN
        sync: false
      - key: SMARTASSISTANCE_ALLOWED_ORIGINS
        sync: false
